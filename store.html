let cartCount=0,cartTotal=0,isFav=false,currentType='restaurant';
function getStoreType(){const p=new URLSearchParams(window.location.search);return p.get('type')||'restaurant';}
function buildPage(){
currentType=getStoreType();
const data=storeData[currentType]||storeData['restaurant'];
document.title='وصّل - '+data.name;
document.getElementById('hero').style.background=data.heroColor;
document.getElementById('hero-emoji').textContent=data.emoji;
document.getElementById('store-name').textContent=data.name;
document.getElementById('store-tags').innerHTML=data.tags.map(t=>`<span class="store-tag">${t}</span>`).join('');
document.getElementById('search-input').placeholder=data.searchPlaceholder;
document.getElementById('cats-container').innerHTML=data.categories.map((c,i)=>`<button class="cat-btn ${i===0?'active':''}" onclick="selectCat(this)">${c}</button>`).join('');
buildSections(data.sections);
}
function buildSections(sections){
document.getElementById('sections-container').innerHTML=sections.map(s=>`
<div class="section" style="margin-top:20px;">
<div class="section-title">${s.title}</div>
<div class="items-grid">
${s.items.map(item=>`
<div class="item-card">
<div class="item-img">${item.emoji}</div>
<div class="item-info">
<div class="item-name">${item.name}</div>
<div class="item-desc">${item.desc}</div>
${item.badge?`<span class="item-badge ${item.badge}">${item.badgeText}</span>`:''}
<div class="item-footer">
<div class="item-price">${item.price.toLocaleString()} ر</div>
<button class="add-btn" onclick="addToCart(this,'${item.name}',${item.price})">+</button>
</div>
</div>
</div>`).join('')}
</div>
</div>`).join('');
}
function selectCat(el){document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');}
function filterItems(){
const q=document.getElementById('search-input').value.trim();
if(!q){buildSections(storeData[currentType].sections);return;}
const filtered=storeData[currentType].sections.map(s=>({...s,items:s.items.filter(i=>i.name.includes(q)||i.desc.includes(q))})).filter(s=>s.items.length>0);
if(filtered.length){buildSections(filtered);}
else{document.getElementById('sections-container').innerHTML='<div style="text-align:center;padding:40px;color:#555;">لم يتم العثور على نتائج 🔍</div>';}
}
function addToCart(btn,name,price){
cartCount++;cartTotal+=price;
btn.textContent='✓';btn.classList.add('added');
setTimeout(()=>{btn.textContent='+';btn.classList.remove('added');},1000);
document.getElementById('cart-count').textContent=cartCount;
document.getElementById('cart-price').textContent=cartTotal.toLocaleString()+' ر';
document.getElementById('cart-bar').classList.add('show');
showToast('✅ تمت الإضافة للسلة');
}
function goToCart(){showToast('فتح سلة الطلبات...');setTimeout(()=>window.location.href='cart.html',800);}
function toggleFav(){isFav=!isFav;document.getElementById('fav-btn').textContent=isFav?'❤️':'🤍';showToast(isFav?'❤️ تمت الإضافة للمفضلة':'تمت الإزالة من المفضلة');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
buildPage();
</script>
