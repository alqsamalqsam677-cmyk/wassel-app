<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وصّل - تسجيل جديد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:#0a0a0a;color:#f0f0f0;min-height:100vh}
.topbar{background:#111;padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #1e1e1e;position:sticky;top:0;z-index:100}
.back{width:38px;height:38px;border-radius:50%;background:#1a1a1a;border:none;color:#f0f0f0;font-size:18px;cursor:pointer}
.topbar h2{font-size:18px;font-weight:700}
.content{padding:20px}
.type-cards{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.type-card{background:#1a1a1a;border-radius:18px;padding:18px;border:2px solid #2a2a2a;cursor:pointer;display:flex;align-items:center;gap:14px;transition:all 0.2s}
.type-card.active{border-color:#1DB954;background:rgba(29,185,84,0.08)}
.type-icon{font-size:36px;width:56px;height:56px;border-radius:14px;background:#222;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.type-name{font-size:16px;font-weight:700}
.type-desc{font-size:12px;color:#666;margin-top:3px}
.type-check{margin-right:auto;width:24px;height:24px;border-radius:50%;border:2px solid #333;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all 0.2s}
.type-card.active .type-check{background:#1DB954;border-color:#1DB954;color:#fff}
.form-section{background:#1a1a1a;border-radius:18px;padding:18px;border:1px solid #2a2a2a;margin-bottom:16px}
.form-section h3{font-size:15px;font-weight:700;margin-bottom:16px;color:#1DB954}
.input-group{margin-bottom:14px}
.input-group label{font-size:13px;color:#888;margin-bottom:6px;display:block}
.input-group input,.input-group select,.input-group textarea{width:100%;padding:13px 16px;background:#111;border:1px solid #2a2a2a;border-radius:12px;color:#f0f0f0;font-family:'Cairo',sans-serif;font-size:14px;outline:none;transition:border 0.2s}
.input-group input:focus,.input-group select:focus{border-color:#1DB954}
.input-group textarea{resize:none;height:80px}
.input-group select option{background:#111}
.vehicle-types{display:flex;gap:8px;flex-wrap:wrap}
.v-btn{padding:10px 16px;background:#111;border:1px solid #2a2a2a;border-radius:10px;color:#888;font-family:'Cairo',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s}
.v-btn.active{border-color:#1DB954;color:#1DB954;background:rgba(29,185,84,0.1)}
.submit-btn{width:100%;padding:16px;background:#1DB954;color:#fff;border:none;border-radius:14px;font-family:'Cairo',sans-serif;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;box-shadow:0 4px 20px rgba(29,185,84,0.3);transition:all 0.2s}
.submit-btn:active{transform:scale(0.98)}
.spacer{height:30px}
#driver-fields,#store-fields{display:none}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:#1DB954;color:#fff;padding:12px 24px;border-radius:30px;font-weight:600;font-size:14px;opacity:0;transition:all 0.3s;z-index:500;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="topbar">
<button class="back" onclick="window.location.href='login.html'">←</button>
<h2>تسجيل جديد في وصّل</h2>
</div>
<div class="content">

<div class="type-cards">
  <div class="type-card active" onclick="selectType('customer',this)">
    <div class="type-icon">👤</div>
    <div>
      <div class="type-name">عميل</div>
      <div class="type-desc">أريد طلب التوصيل</div>
    </div>
    <div class="type-check">✓</div>
  </div>
  <div class="type-card" onclick="selectType('driver',this)">
    <div class="type-icon">🛵</div>
    <div>
      <div class="type-name">سائق توصيل</div>
      <div class="type-desc">أريد العمل كسائق وكسب المال</div>
    </div>
    <div class="type-check"></div>
  </div>
  <div class="type-card" onclick="selectType('store',this)">
    <div class="type-icon">🏪</div>
    <div>
      <div class="type-name">صاحب محل</div>
      <div class="type-desc">أريد تسجيل محلي في التطبيق</div>
    </div>
    <div class="type-check"></div>
  </div>
</div>

<div class="form-section">
  <h3>📋 المعلومات الأساسية</h3>
  <div class="input-group">
    <label>الاسم الكامل</label>
    <input type="text" placeholder="اسمك هنا">
  </div>
  <div class="input-group">
    <label>رقم الهاتف</label>
    <input type="tel" placeholder="7xxxxxxxx">
  </div>
  <div class="input-group">
    <label>المدينة</label>
    <select>
      <option>صنعاء</option>
      <option>عدن</option>
      <option>تعز</option>
      <option>الحديدة</option>
      <option>إب</option>
      <option>ذمار</option>
      <option>مأرب</option>
    </select>
  </div>
  <div class="input-group">
    <label>كلمة المرور</label>
    <input type="password" placeholder="••••••••">
  </div>
</div>

<div class="form-section" id="driver-fields">
  <h3>🛵 معلومات السائق</h3>
  <div class="input-group">
    <label>نوع المركبة</label>
    <div class="vehicle-types">
      <button class="v-btn active" onclick="selectVehicle(this)">🛵 مترة</button>
      <button class="v-btn" onclick="selectVehicle(this)">🚲 سيكل</button>
      <button class="v-btn" onclick="selectVehicle(this)">🚐 وايت</button>
      <button class="v-btn" onclick="selectVehicle(this)">🚗 سيارة</button>
    </div>
  </div>
  <div class="input-group">
    <label>رقم لوحة المركبة</label>
    <input type="text" placeholder="مثال: أ ب ج 1234">
  </div>
  <div class="input-group">
    <label>رقم الهوية الوطنية</label>
    <input type="text" placeholder="رقم الهوية">
  </div>
</div>

<div class="form-section" id="store-fields">
  <h3>🏪 معلومات المحل</h3>
  <div class="input-group">
    <label>اسم المحل</label>
    <input type="text" placeholder="اسم محلك">
  </div>
  <div class="input-group">
    <label>نوع المحل</label>
    <select>
      <option>🍖 مطعم</option>
      <option>💊 صيدلية</option>
      <option>🛒 بقالة</option>
      <option>🥦 خضار وفاكهة</option>
      <option>🥩 لحوم وأسماك</option>
      <option>🍯 عسل ومنتجات طبيعية</option>
      <option>🥖 مخبز</option>
      <option>📦 متنوع</option>
    </select>
  </div>
  <div class="input-group">
    <label>عنوان المحل</label>
    <input type="text" placeholder="الحي والشارع">
  </div>
  <div class="input-group">
    <label>وصف المحل</label>
    <textarea placeholder="اكتب وصفاً مختصراً لمحلك ومنتجاتك..."></textarea>
  </div>
  <div class="input-group">
    <label>ساعات العمل</label>
    <input type="text" placeholder="مثال: 8 صباحاً - 11 مساءً">
  </div>
</div>

<button class="submit-btn" onclick="doRegister()">✓ إنشاء الحساب والانضمام</button>
<div class="spacer"></div>
</div>

<div id="toast"></div>
<script>
let currentType='customer';
function selectType(type,el){
  currentType=type;
  document.querySelectorAll('.type-card').forEach(c=>{c.classList.remove('active');c.querySelector('.type-check').textContent=''});
  el.classList.add('active');
  el.querySelector('.type-check').textContent='✓';
  document.getElementById('driver-fields').style.display=type==='driver'?'block':'none';
  document.getElementById('store-fields').style.display=type==='store'?'block':'none';
}
function selectVehicle(el){
  document.querySelectorAll('.v-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
}
function doRegister(){
  const msgs={customer:'🎉 تم تسجيلك كعميل! مرحباً بك في وصّل',driver:'🛵 تم تسجيلك كسائق! سنتواصل معك قريباً',store:'🏪 تم تسجيل محلك! سنراجع طلبك ونتواصل معك'};
  showToast(msgs[currentType]);
  setTimeout(()=>window.location.href='index.html',2000);
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
</body>
</html>
