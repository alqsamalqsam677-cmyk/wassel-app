<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وصّل - تتبع طلبك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:#0a0a0a;color:#f0f0f0;min-height:100vh}
.topbar{background:#111;padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #1e1e1e;position:sticky;top:0;z-index:100}
.back{width:38px;height:38px;border-radius:50%;background:#1a1a1a;border:none;color:#f0f0f0;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.topbar h2{font-size:18px;font-weight:700}
.map-area{height:220px;background:linear-gradient(180deg,#050f05,#0a180a);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.map-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(29,185,84,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(29,185,84,0.05) 1px,transparent 1px);background-size:30px 30px}
.map-line{position:absolute;width:60%;height:2px;background:linear-gradient(90deg,#eab308,#1DB954)}
.dot-a{position:absolute;right:22%;width:14px;height:14px;border-radius:50%;background:#eab308;box-shadow:0 0 0 5px rgba(234,179,8,0.2)}
.dot-b{position:absolute;left:22%;width:14px;height:14px;border-radius:50%;background:#1DB954;box-shadow:0 0 0 5px rgba(29,185,84,0.2)}
.rider{position:absolute;font-size:28px;animation:move 2.5s ease infinite alternate;filter:drop-shadow(0 0 8px rgba(59,130,246,0.5));z-index:2}
@keyframes move{from{transform:translateX(-50px)}to{transform:translateX(50px)}}
.eta-box{position:absolute;top:12px;right:12px;background:rgba(0,0,0,0.75);border:1px solid #3B82F6;border-radius:10px;padding:5px 12px;font-size:13px;font-weight:700;color:#3B82F6}
.content{padding:20px}
.steps{display:flex;gap:0;margin-bottom:20px;position:relative}
.steps::before{content:'';position:absolute;top:18px;right:18px;left:18px;height:2px;background:#222;z-index:0}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;z-index:1}
.step-circle{width:36px;height:36px;border-radius:50%;background:#1a1a1a;border:2px solid #333;display:flex;align-items:center;justify-content:center;font-size:16px}
.step-circle.done{background:#1DB954;border-color:#1DB954}
.step-circle.active{border-color:#1DB954;animation:pulse 1s ease infinite}
@keyframes pulse{0%,100%{border-color:#1DB954}50%{border-color:transparent}}
.step span{font-size:11px;color:#666;text-align:center}
.step.done span,.step.active span{color:#1DB954}
.driver-card{background:#1a1a1a;border-radius:16px;padding:16px;display:flex;align-items:center;gap:12px;margin-bottom:16px;border:1px solid #2a2a2a}
.d-avatar{width:50px;height:50px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;font-size:26px;border:2px solid #1DB954}
.d-name{font-size:15px;font-weight:700}
.d-rating{font-size:12px;color:#eab308;margin-top:2px}
.d-btns{margin-right:auto;display:flex;gap:8px}
.d-btn{width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px}
.d-btn.call{background:rgba(29,185,84,0.12)}
.d-btn.msg{background:#222}
.order-card{background:#1a1a1a;border-radius:16px;padding:16px;border:1px solid #2a2a2a;margin-bottom:16px}
.order-card h4{font-size:15px;font-weight:700;margin-bottom:12px}
.order-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid #222}
.order-row:last-child{border:none}
.order-row .val{font-weight:700;color:#1DB954}
.cancel-btn{width:100%;padding:14px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);color:#ef4444;border-radius:14px;font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;cursor:pointer}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #1e1e1e;display:flex;padding:12px 0 20px}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:11px;color:#666}
.nav-item .ni{font-size:22px}
.nav-item.active{color:#1DB954}
.spacer{height:90px}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#1DB954;color:#fff;padding:12px 24px;border-radius:30px;font-weight:600;font-size:14px;opacity:0;transition:all 0.3s;z-index:500;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="topbar">
<button class="back" onclick="window.location.href='index.html'">←</button>
<h2>تتبع طلبك 🛵</h2>
</div>
<div class="map-area">
<div class="map-grid"></div>
<div class="map-line"></div>
<div class="dot-a"></div>
<div class="dot-b"></div>
<div class="rider">🛵</div>
<div class="eta-box">⏱ 12 دقيقة</div>
</div>
<div class="content">
<div class="steps">
<div class="step done">
<div class="step-circle done">✓</div>
<span>تم الطلب</span>
</div>
<div class="step done">
<div class="step-circle done">✓</div>
<span>جاهز</span>
</div>
<div class="step active">
<div class="step-circle active">🛵</div>
<span>في الطريق</span>
</div>
<div class="step">
<div class="step-circle">🏠</div>
<span>وصل</span>
</div>
</div>
<div class="driver-card">
<div class="d-avatar">👨</div>
<div>
<div class="d-name">أحمد محمد</div>
<div class="d-rating">⭐ 4.9 — مترة هوندا</div>
</div>
<div class="d-btns">
<button class="d-btn call" onclick="showToast('جاري الاتصال... 📞')">📞</button>
<button class="d-btn msg" onclick="showToast('فتح المحادثة... 💬')">💬</button>
</div>
</div>
<div class="order-card">
<h4>تفاصيل طلبك</h4>
<div class="order-row"><span>المحل</span><span class="val">مطعم الأصيل</span></div>
<div class="order-row"><span>المحتويات</span><span class="val">دجاج مشوي + أرز</span></div>
<div class="order-row"><span>المبلغ</span><span class="val">3,500 ريال</span></div>
<div class="order-row"><span>رقم الطلب</span><span class="val">#1042</span></div>
</div>
<button class="cancel-btn" onclick="showToast('لا يمكن إلغاء الطلب الآن')">إلغاء الطلب</button>
</div>
<div class="spacer"></div>
<div class="bottom-nav">
<div class="nav-item" onclick="window.location.href='index.html'"><div class="ni">🏠</div>الرئيسية</div>
<div class="nav-item" onclick="showToast('طلباتي')"><div class="ni">📋</div>طلباتي</div>
<div class="nav-item active"><div class="ni">🛵</div>تتبع</div>
<div class="nav-item" onclick="showToast('المفضلة')"><div class="ni">❤️</div>المفضلة</div>
<div class="nav-item" onclick="window.location.href='login.html'"><div class="ni">👤</div>حسابي</div>
</div>
<div id="toast"></div>
<script>
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
</script>
</body>
  </html>
